<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EmulatorJS - EarthBound</title>

  <style>
    :root {
      color-scheme: dark;
      --hud-bg: rgba(12, 18, 23, 0.78);
      --hud-border: rgba(140, 170, 185, 0.25);
      --hud-text: #eaf6f8;
      --track: rgba(180, 205, 215, 0.13);
      --accent: #00e5d0;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: #333;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: min(640px, 100vw);
      height: min(480px, 100vh);
      margin: 0 auto;
    }

    #game {
      width: 100%;
      height: 100%;
    }

    #load-controls {
      position: absolute;
      z-index: 10;
      top: 50%;
      left: 50%;
      width: min(90vw, 360px);
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    #load-game {
      padding: 0.45em 1.2em;
      border: 2px solid #fff;
      border-radius: 9px;
      background: #000;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
    }

    #load-game:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    #rom-label {
      color: #fff;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    #load-rom {
      display: none;
    }

    #load-status {
      min-height: 1.2em;
      max-width: 100%;
      overflow-wrap: anywhere;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
    }

    /* SNES controller input HUD */
    #input-timeline-container {
      position: fixed;
      left: 18px;
      bottom: 18px;
      width: min(var(--controller-width, 420px), calc(100vw - 36px));
      z-index: 99999;
      user-select: none;
      pointer-events: auto;
      cursor: pointer;
      touch-action: manipulation;
    }


    #input-hud-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 100000;
      pointer-events: auto;
      padding: 7px 10px;
      border: 1px solid var(--hud-border);
      border-radius: 8px;
      background: rgba(12, 18, 23, 0.88);
      color: var(--hud-text);
      font: 600 12px/1.2 system-ui, sans-serif;
      cursor: pointer;
      user-select: none;
    }

    #input-hud-toggle:hover { background: rgba(25, 38, 45, 0.96); }
    #input-hud-toggle:focus-visible { outline: 2px solid #ff1c2e; outline-offset: 2px; }
    #input-timeline-container.is-hidden { display: none; }

    #controller-size-control {
      position: fixed;
      top: 52px;
      right: 12px;
      z-index: 100000;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border: 1px solid var(--hud-border);
      border-radius: 8px;
      background: rgba(12, 18, 23, 0.9);
      color: var(--hud-text);
      font: 600 12px/1.2 system-ui, sans-serif;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #controller-size-control.is-hidden { display: none; }
    #controller-size-control label { white-space: nowrap; }
    #controller-size { width: 125px; accent-color: var(--accent); cursor: pointer; }
    #controller-size-value { min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
    #controller-size-control.is-fullscreen-size { top: 43px; right: 8px; padding: 6px 8px; }
    #controller-size-control.is-fullscreen-size #controller-size { width: 100px; }

    #input-timeline-container.is-fullscreen-hud {
      left: 12px;
      bottom: 12px;
      width: min(360px, calc(100vw - 24px));
    }

    #input-hud-toggle.is-fullscreen-toggle {
      top: 8px;
      right: 8px;
      padding: 5px 7px;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      #game-container {
        width: 100vw;
        height: auto;
        aspect-ratio: 4 / 3;
      }

      #input-timeline-container {
        left: 10px;
        bottom: 10px;
        width: min(var(--controller-width, 420px), calc(100vw - 20px));
      }
      #controller-size-control { top: 52px; right: 8px; gap: 6px; padding: 7px 8px; }
      #controller-size { width: 90px; }
    }

    /* Embedded SNES input widget styles */

/* Embed-friendly: all styles are scoped to .snes-input-widget */
.snes-input-widget {
  --snes-bg: #111827;
  --snes-edge: #52617d;
  --snes-key: #26334b;
  --snes-lit: #318bff;
  display: inline-block;
  padding: 18px;
  transform: scale(var(--controller-scale, 1));
  transform-origin: top left;
  background: #080e1b;
  border: 2px solid #40527c;
  box-shadow: 4px 4px 0 #03060d;
  color: #e5edff;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  user-select: none;
  touch-action: manipulation;
}
.snes-input-widget * { box-sizing: border-box; }
.snes-input-widget button { -webkit-tap-highlight-color: transparent; }
.snes-input-widget button:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}
.snes-input-widget .snes-controls {
  display: flex;
  align-items: center;
  gap: clamp(14px, 3vw, 34px);
}
.snes-input-widget .snes-dpad {
  width: 108px;
  height: 108px;
  position: relative;
  flex: 0 0 108px;
}
.snes-input-widget .snes-dpad::before {
  content: "";
  position: absolute;
  inset: 0;
  border: 2px solid #52617d;
  border-radius: 50%;
  opacity: .55;
}
.snes-input-widget .snes-cross {
  position: absolute;
  inset: 10px;
}
.snes-input-widget .snes-dir {
  position: absolute;
  border: 3px solid #090e19;
  border-radius: 5px;
  background: linear-gradient(135deg, #36445f, #1c263a);
  box-shadow: inset 2px 2px #596781, inset -2px -2px #111827;
  transition: background .06s, transform .06s, box-shadow .06s;
}
.snes-input-widget .snes-dir.up,
.snes-input-widget .snes-dir.down {
  left: 30px; width: 28px; height: 42px;
}
.snes-input-widget .snes-dir.up { top: 0; }
.snes-input-widget .snes-dir.down { bottom: 0; }
.snes-input-widget .snes-dir.left,
.snes-input-widget .snes-dir.right {
  top: 30px; width: 42px; height: 28px;
}
.snes-input-widget .snes-dir.left { left: 0; }
.snes-input-widget .snes-dir.right { right: 0; }
.snes-input-widget .snes-dir.active {
  background: linear-gradient(135deg, #54a5ff, #1760c8);
  box-shadow: inset 2px 2px #a5d1ff, 0 0 12px #318bff88;
  transform: scale(.92);
}
.snes-input-widget .snes-center {
  position: absolute; left: 43px; top: 43px; width: 12px; height: 12px;
  background: #111827; border: 2px solid #64728c; border-radius: 50%;
  pointer-events: none;
}
.snes-input-widget .snes-middle {
  display: flex;
  align-items: center;
  gap: 12px;
}
.snes-input-widget .snes-small {
  display: flex; flex-direction: column; align-items: center; gap: 9px;
  color: #a9b8d7; font-size: 11px; font-weight: 800; letter-spacing: .04em;
}
.snes-input-widget .snes-small button {
  width: 43px; height: 17px; padding: 0; cursor: pointer;
  border: 3px solid #080d17; border-radius: 9px;
  background: linear-gradient(#626f89, #303c55);
  box-shadow: inset 0 2px #9aa6bd, 0 2px #65718a;
  transform: rotate(-32deg);
}
.snes-input-widget .snes-small button.active {
  background: #318bff; box-shadow: 0 0 12px #318bff88; transform: rotate(-32deg) scale(.92);
}
.snes-input-widget .snes-facepad {
  width: 126px; height: 126px; position: relative; flex: 0 0 126px;
  transform: rotate(-2deg);
}
.snes-input-widget .snes-face {
  position: absolute; width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center; padding: 0; cursor: pointer;
  border: 4px solid #e7edfa; color: #fff; font: 900 16px ui-monospace, monospace;
  text-shadow: 1px 2px #343434;
  box-shadow: inset 0 -5px #0005, inset 0 3px #fff6, 0 3px #3e4960;
  transition: transform .06s, filter .06s, box-shadow .06s;
}
.snes-input-widget .snes-face.x { top: 0; left: 39px; background: #1762e9; }
.snes-input-widget .snes-face.y { top: 39px; left: 0; background: #13a65d; }
.snes-input-widget .snes-face.a { top: 39px; right: 0; background: #e52c37; }
.snes-input-widget .snes-face.b { bottom: 0; left: 39px; background: #e9b600; }
.snes-input-widget .snes-face.active {
  transform: scale(.88); filter: brightness(1.35);
  box-shadow: inset 0 -2px #0003, 0 0 13px currentColor;
}
.snes-input-widget .snes-hint {
  margin-top: 14px; color: #8398c6; font-size: 11px; text-align: center;
}
@media (max-width: 460px) {
  .snes-input-widget { padding: 12px; }
  .snes-input-widget .snes-controls { gap: 10px; }
  .snes-input-widget .snes-dpad { transform: scale(.82); transform-origin: center; margin: -9px; }
  .snes-input-widget .snes-facepad { transform: scale(.82) rotate(-2deg); transform-origin: center; margin: -11px; }
  .snes-input-widget .snes-middle { gap: 5px; }
  .snes-input-widget .snes-small button { width: 35px; }
}

  </style>
</head>

<body>
  <main id="game-container">
    <div id="game"></div>

    <div id="load-controls">
      <button id="load-game" type="button">Enter</button>
      <label id="rom-label" for="load-rom">or load a ROM file</label>
      <input type="file" id="load-rom" accept=".smc,.sfc,.zip">
      <div id="load-status" role="status" aria-live="polite"></div>
    </div>
  </main>

  <aside id="input-timeline-container" aria-label="SNES controller input display">
    <div class="snes-input-widget" data-snes-input-widget>
  <div class="snes-controls">
    <div class="snes-dpad" aria-label="Steuerkreuz">
      <div class="snes-cross">
        <button class="snes-dir up" data-input="up" aria-label="Oben"></button>
        <button class="snes-dir left" data-input="left" aria-label="Links"></button>
        <button class="snes-dir right" data-input="right" aria-label="Rechts"></button>
        <button class="snes-dir down" data-input="down" aria-label="Unten"></button>
        <span class="snes-center"></span>
      </div>
    </div>
    <div class="snes-middle">
      <div class="snes-small"><button data-input="select" aria-label="Select"></button><span>SELECT</span></div>
      <div class="snes-small"><button data-input="start" aria-label="Start"></button><span>START</span></div>
    </div>
    <div class="snes-facepad" aria-label="ABXY Buttons">
      <button class="snes-face x" data-input="x" aria-label="X">X</button>
      <button class="snes-face y" data-input="y" aria-label="Y">Y</button>
      <button class="snes-face a" data-input="a" aria-label="A">A</button>
      <button class="snes-face b" data-input="b" aria-label="B">B</button>
    </div>
  </div>
</div>
  </aside>

  <button
    id="input-hud-toggle"
    type="button"
    aria-controls="input-timeline-container"
    aria-pressed="true"
  >Hide Controller</button>

  <div id="controller-size-control" class="is-hidden" aria-label="Controller size settings">
    <label for="controller-size">Controller size</label>
    <input id="controller-size" type="range" min="180" max="620" step="10" value="420" aria-label="Controller width in pixels">
    <output id="controller-size-value" for="controller-size">420 px</output>
  </div>

  <div id="script-placeholder"></div>

  <script>
    // EmulatorJS configuration must be set before loader.js is loaded.
    window.EJS_player = "#game";
    window.EJS_core = "snes";
    window.EJS_gameName = "EarthBound";
    window.EJS_color = "#0064ff";
    window.EJS_startOnLoaded = true;
    window.EJS_pathtodata = "code/";
    window.EJS_gameUrl = "games/EarthBound.smc";
    window.states_path = "states/";
    window.EJS_loadStateURL = window.states_path + "EarthBound.state";
    window.EJS_DEBUG_XX = true;

    (() => {
      const loadButton = document.getElementById("load-game");
      const romInput = document.getElementById("load-rom");
      const status = document.getElementById("load-status");
      const placeholder = document.getElementById("script-placeholder");

      let emulatorStarted = false;
      let selectedRomUrl = null;

      function startEmulator() {
        if (emulatorStarted) return;

        emulatorStarted = true;
        loadButton.disabled = true;
        status.textContent = "Starting EmulatorJS…";

        const loader = document.createElement("script");
        loader.src = window.EJS_pathtodata + "loader.js";
        loader.async = true;

        loader.onload = () => {
          document.getElementById("load-controls")?.remove();
        };

        loader.onerror = () => {
          emulatorStarted = false;
          loadButton.disabled = false;
          status.textContent =
            "Could not load EmulatorJS. Check that code/loader.js exists.";
        };

        placeholder.appendChild(loader);
      }

      async function loadDefaultGame() {
        loadButton.disabled = true;
        status.textContent = "Checking ROM…";

        try {
          const response = await fetch(window.EJS_gameUrl, {
            method: "HEAD",
            cache: "no-store"
          });

          if (!response.ok) {
            status.textContent =
              "ROM not found at " + window.EJS_gameUrl +
              ". Choose a ROM file instead.";
            loadButton.disabled = false;
            return;
          }

          startEmulator();
        } catch (error) {
          status.textContent =
            "Could not check the ROM. Choose a ROM file or check your server.";
          loadButton.disabled = false;
        }
      }

      function loadRom(event) {
        const file = event.target.files?.[0];
        if (!file) return;

        if (selectedRomUrl) {
          URL.revokeObjectURL(selectedRomUrl);
        }

        selectedRomUrl = URL.createObjectURL(file);

        window.EJS_gameUrl = selectedRomUrl;
        window.EJS_gameName = file.name.replace(/\.[^.]+$/, "");

        // Only attempt the bundled state for the intended default game.
        if (/^EarthBound\.smc$/i.test(file.name)) {
          window.EJS_loadStateURL =
            window.states_path + "EarthBound.state";
        } else {
          delete window.EJS_loadStateURL;
        }

        startEmulator();
      }

      loadButton.addEventListener("click", loadDefaultGame);
      romInput.addEventListener("change", loadRom);
    })();
  </script>

  <script>
    (() => {
      const hud = document.getElementById("input-timeline-container");
      const toggle = document.getElementById("input-hud-toggle");
      const sizeControl = document.getElementById("controller-size-control");
      const sizeSlider = document.getElementById("controller-size");
      const sizeValue = document.getElementById("controller-size-value");

      // Apply the selected width and remember it for the next visit.
      let savedWidth = 420;
      try { savedWidth = Number(localStorage.getItem("retropulse-controller-width")) || 420; } catch (_) {}
      if (savedWidth >= 180 && savedWidth <= 620) sizeSlider.value = String(savedWidth);

      function applyControllerSize() {
        const width = Number(sizeSlider.value);
        document.documentElement.style.setProperty("--controller-width", `${width}px`);
        // The HUD width alone only changed its invisible wrapper; scale the actual controller art too.
        document.documentElement.style.setProperty("--controller-scale", String(width / 420));
        sizeValue.value = `${width} px`;
        sizeValue.textContent = `${width} px`;
        try { localStorage.setItem("retropulse-controller-width", String(width)); } catch (_) {}
      }
      sizeSlider.addEventListener("input", applyControllerSize);
      applyControllerSize();

      // Tap the controller display to reveal the size slider only when needed.
      hud.setAttribute("title", "Tap to adjust controller size");
      hud.setAttribute("role", "button");
      hud.setAttribute("tabindex", "0");

      function showSizeControl() {
        if (hud.classList.contains("is-hidden")) return;
        sizeControl.classList.remove("is-hidden");
      }
      function hideSizeControl() {
        sizeControl.classList.add("is-hidden");
      }
      hud.addEventListener("click", (event) => {
        event.stopPropagation();
        sizeControl.classList.toggle("is-hidden");
      });
      hud.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          sizeControl.classList.toggle("is-hidden");
        }
      });
      sizeControl.addEventListener("click", (event) => event.stopPropagation());
      document.addEventListener("click", (event) => {
        if (!sizeControl.contains(event.target) && !hud.contains(event.target)) {
          hideSizeControl();
        }
      });

      // Keep placeholders so the HUD can return to its original location.
      const hudHome = document.createComment("input HUD home");
      const toggleHome = document.createComment("input HUD toggle home");
      const sizeControlHome = document.createComment("controller size control home");

      hud.parentNode.insertBefore(hudHome, hud);
      toggle.parentNode.insertBefore(toggleHome, toggle);
      sizeControl.parentNode.insertBefore(sizeControlHome, sizeControl);

      // Show or hide the timeline without disabling input tracking.
      toggle.addEventListener("click", () => {
        const isHidden = hud.classList.toggle("is-hidden");
        if (isHidden) sizeControl.classList.add("is-hidden");

        toggle.textContent = isHidden
          ? "Show Controller"
          : "Hide Controller";

        toggle.setAttribute("aria-pressed", String(!isHidden));
      });

      function syncFullscreenHud() {
        const fullscreenRoot = document.fullscreenElement;

        if (fullscreenRoot) {
          // Keep the controller overlay inside the fullscreen element.
          if (fullscreenRoot !== hud.parentElement) {
            fullscreenRoot.appendChild(hud);
          }

          if (fullscreenRoot !== toggle.parentElement) {
            fullscreenRoot.appendChild(toggle);
          }
          if (fullscreenRoot !== sizeControl.parentElement) {
            fullscreenRoot.appendChild(sizeControl);
          }

          hud.classList.add("is-fullscreen-hud");
          toggle.classList.add("is-fullscreen-toggle");
          sizeControl.classList.add("is-fullscreen-size");
        } else {
          hud.classList.remove("is-fullscreen-hud");
          toggle.classList.remove("is-fullscreen-toggle");
          sizeControl.classList.remove("is-fullscreen-size");

          if (sizeControlHome.parentNode) {
            sizeControlHome.parentNode.insertBefore(sizeControl, sizeControlHome.nextSibling);
          }
          if (hudHome.parentNode) {
            hudHome.parentNode.insertBefore(hud, hudHome.nextSibling);
          }

          if (toggleHome.parentNode) {
            toggleHome.parentNode.insertBefore(
              toggle,
              toggleHome.nextSibling
            );
          }
        }
      }

      document.addEventListener("fullscreenchange", syncFullscreenHud);
      document.addEventListener("webkitfullscreenchange", syncFullscreenHud);

      syncFullscreenHud();
    })();
  </script>


<script>

(() => {
  document.querySelectorAll('[data-snes-input-widget]').forEach(root => {
    if (root.dataset.initialized === 'true') return;
    root.dataset.initialized = 'true';

    // RetroPulse keyboard mapping:
    // Arrows = D-pad, X = A, Z = B, S = X, A = Y,
    // Enter = Start, Space = Select.
    const keyboardMap = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      KeyX: 'a', KeyZ: 'b', KeyS: 'x', KeyA: 'y',
      Enter: 'start', Space: 'select'
    };

    // Match the existing RetroPulse Standard Gamepad mapping.
    const gamepadMap = {
      0: 'b', 1: 'a', 2: 'y', 3: 'x',
      8: 'select', 9: 'start',
      12: 'up', 13: 'down', 14: 'left', 15: 'right'
    };

    const keysDown = new Set();
    const gamepadDown = new Set();

    function render() {
      root.querySelectorAll('[data-input]').forEach(el => {
        const input = el.dataset.input;
        el.classList.toggle('active', keysDown.has(input) || gamepadDown.has(input));
      });
    }

    function onKeyDown(event) {
      const input = keyboardMap[event.code];
      if (!input) return;
      keysDown.add(input);
      // Do not cancel or stop the event: EmulatorJS must receive it too.
      render();
    }

    function onKeyUp(event) {
      const input = keyboardMap[event.code];
      if (!input) return;
      keysDown.delete(input);
      render();
    }

    function clearKeyboard() {
      keysDown.clear();
      render();
    }

    window.addEventListener('keydown', onKeyDown, { passive: true });
    window.addEventListener('keyup', onKeyUp, { passive: true });
    window.addEventListener('blur', clearKeyboard);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) clearKeyboard();
    });

    function pollGamepads() {
      gamepadDown.clear();
      if (navigator.getGamepads) {
        for (const pad of Array.from(navigator.getGamepads()).filter(Boolean)) {
          const pressed = index =>
            !!pad.buttons[index]?.pressed || (pad.buttons[index]?.value ?? 0) > 0.5;

          for (const [index, input] of Object.entries(gamepadMap)) {
            if (pressed(Number(index))) gamepadDown.add(input);
          }

          // Analog stick fallback for controllers without exposed D-pad buttons.
          if ((pad.axes[1] ?? 0) < -0.5) gamepadDown.add('up');
          if ((pad.axes[1] ?? 0) > 0.5) gamepadDown.add('down');
          if ((pad.axes[0] ?? 0) < -0.5) gamepadDown.add('left');
          if ((pad.axes[0] ?? 0) > 0.5) gamepadDown.add('right');
        }
      }
      render();
      requestAnimationFrame(pollGamepads);
    }

    render();
    requestAnimationFrame(pollGamepads);
  });
})();

</script>
</body>
</html>
