    <!-- Erweiterte Logik für Tastatur & echte Gamepads -->
    <script>
      (function() {
        const activeBars = {};
        const speed = 2.5; // Geschwindigkeit der Balken
        const heldKeys = {}; // Sperre gegen ineinanderlaufende Balken

        // Tasten-Mapping für Tastatur
        const keyMap = {
          'ArrowUp': 'up',
          'ArrowDown': 'down',
          'ArrowLeft': 'left',
          'ArrowRight': 'right',
          'x': 'button-a',
          'z': 'button-b',
          's': 'button-x',
          'a': 'button-y',
          'Enter': 'start',
          ' ': 'select'
        };

        // Tasten-Mapping für standardisierte Gamepads
        const gamepadMap = {
          12: 'up',
          13: 'down',
          14: 'left',
          15: 'right',
          0: 'button-b',
          1: 'button-a',
          2: 'button-y',
          3: 'button-x',
          8: 'select',
          9: 'start'
        };

        function startBar(action) {
          if (!action || activeBars[action]) return;
          const lane = document.querySelector(`.timeline-row[data-key="${action}"] .lane`);
          if (!lane) return;

          const bar = document.createElement('div');
          bar.className = 'input-bar';
          bar.style.width = '0px';
          lane.appendChild(bar);

          activeBars[action] = { element: bar, width: 0, isHolding: true };
        }

        function stopBar(action) {
          if (action && activeBars[action]) {
            activeBars[action].isHolding = false;
          }
        }

        // Standard-Events nutzen, OHNE passive/capture, damit das Spiel die Inputs wieder bekommt!
        window.addEventListener('keydown', (e) => { 
          const action = keyMap[e.key];
          if (action) {
            // Verhindert, dass das Betriebssystem bei gehaltenem Tastendruck neue Balken triggert
            if (!heldKeys[action]) {
              heldKeys[action] = true;
              startBar(action);
            }
          }
        });

        window.addEventListener('keyup', (e) => { 
          const action = keyMap[e.key];
          if (action) {
            heldKeys[action] = false;
            stopBar(action);
          }
        });

        const prevGamepadState = {};

        function renderTimeline() {
          // Gamepad abfragen (wird vom Emulator nie blockiert)
          const gamepads = navigator.getGamepads();
          if (gamepads) {
            for (let i = 0; i < gamepads.length; i++) {
              const gp = gamepads[i];
              if (!gp) continue;
              
              for (let btnIdx in gamepadMap) {
                const action = gamepadMap[btnIdx];
                const isPressed = gp.buttons[btnIdx]?.pressed;
                
                if (isPressed && !prevGamepadState[action]) {
                  startBar(action);
                  prevGamepadState[action] = true;
                } else if (!isPressed && prevGamepadState[action]) {
                  stopBar(action);
                  prevGamepadState[action] = false;
                }
              }
            }
          }

          // Balken bewegen
          const allBars = document.querySelectorAll('.input-bar');
          allBars.forEach(bar => {
            let barData = null;
            for (let action in activeBars) {
              if (activeBars[action].element === bar) {
                barData = activeBars[action];
                break;
              }
            }

            if (barData && barData.isHolding) {
              barData.width += speed;
              bar.style.width = barData.width + 'px';
            } else {
              let currentRight = parseInt(bar.style.right || 0);
              let newRight = currentRight + speed;
              bar.style.right = newRight + 'px';

              if (newRight > 240) { bar.remove(); }
            }
          });

          for (let action in activeBars) {
            if (!activeBars[action].isHolding) { delete activeBars[action]; }
          }

          requestAnimationFrame(renderTimeline);
        }

        requestAnimationFrame(renderTimeline);
      })();
    </script>
